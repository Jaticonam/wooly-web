<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redireccionando | Wooly Import Store</title>
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#ffffff">

<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:#fdfbf7;color:#2f2437;display:flex;align-items:center;justify-content:center;overflow:hidden}
.bg{position:fixed;inset:0;background:linear-gradient(90deg,#d9f3f6 0 15%,#fff 15% 85%,#f7d8e4 85% 100%);z-index:0}
.bg::after{content:"✦  ✧  ✦  ✧  ✦";position:absolute;inset:auto 0 8%;text-align:center;font-size:90px;letter-spacing:22px;color:rgba(236,164,194,.09);white-space:nowrap}
.card{position:relative;z-index:1;width:min(94vw,540px);background:rgba(255,255,255,.92);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.82);box-shadow:0 30px 90px rgba(80,50,80,.2);border-radius:36px;padding:20px 20px 24px;text-align:center;animation:fade .45s ease}
.brand{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#8f8194;font-weight:900;margin:4px 0 14px}
.previewWrap{width:100%;aspect-ratio:16/10;border-radius:28px;overflow:hidden;background:#f3edf2;box-shadow:0 18px 44px rgba(80,50,80,.17);margin-bottom:14px}
.preview{width:100%;height:100%;object-fit:cover;display:block;animation:zoom 5s ease-in-out infinite alternate}
.kicker{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:900;color:#7c6a80;background:#f7edf3;border-radius:999px;padding:8px 14px;margin-bottom:11px}
h1{font-size:25px;line-height:1.14;margin:0 0 7px;color:#2f2437}
p{margin:0 auto 16px;font-size:15px;line-height:1.46;color:#6d6072;max-width:370px}
.loader{height:7px;width:100%;border-radius:999px;background:#f0e6ed;overflow:hidden;margin:17px 0}
.bar{position:relative;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#eca4c2,#9bdce5);animation:progress 1.8s linear forwards;overflow:hidden}
.bar::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:shine 1.1s infinite}
a{display:inline-flex;align-items:center;justify-content:center;width:100%;height:50px;border-radius:999px;background:#2f2437;color:white;text-decoration:none;font-weight:900;box-shadow:0 12px 28px rgba(47,36,55,.22)}
small{display:block;margin-top:13px;color:#9a8f9d;font-size:12px}
@keyframes fade{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
@keyframes zoom{from{transform:scale(1)}to{transform:scale(1.055)}}
@keyframes progress{from{width:0}to{width:100%}}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(200%)}}
@media(max-width:480px){
.card{padding:16px 16px 20px;border-radius:28px}
.previewWrap{border-radius:22px}
h1{font-size:22px}
p{font-size:14px}
.bg::after{font-size:58px;letter-spacing:14px}
}
</style>
</head>

<body>
<div class="bg"></div>

<main class="card">
  <div class="brand">Wooly Import Store</div>

  <div class="previewWrap">
    <img id="img" class="preview" src="/og/catalogo.jpg" alt="Wooly Import Store">
  </div>

  <div id="kicker" class="kicker">✨ Un momento...</div>
  <h1 id="title">Preparando tu catálogo...</h1>
  <p id="desc">Estamos cargando productos mayoristas seleccionados para emprendedores.</p>

  <div class="loader"><div class="bar"></div></div>

  <a id="btn" href="/catalogo">Entrar ahora</a>
  <small>Redireccionando automáticamente...</small>
</main>

<script>
const params = new URLSearchParams(window.location.search);

const type = params.get("type") || "catalog";
const title = params.get("title") || "Preparando tu catálogo...";
const img = params.get("img") || "/og/catalogo.jpg";
const url = params.get("url") || "/catalogo";

const defaults = {
  campaign: {
    kicker: "🎯 Campaña especial",
    desc: "Estamos preparando esta campaña mayorista para ti."
  },
  category: {
    kicker: "📦 Categoría seleccionada",
    desc: "Estamos cargando esta categoría con productos de alta rotación."
  },
  product: {
    kicker: "🛍️ Producto seleccionado",
    desc: "Estamos preparando este producto para que puedas revisarlo."
  },
  blog: {
    kicker: "📚 Centro de crecimiento",
    desc: "Estamos cargando esta guía para ayudarte a vender mejor."
  },
  catalog: {
    kicker: "✨ Un momento...",
    desc: "Estamos cargando productos mayoristas seleccionados para emprendedores."
  }
};

const config = defaults[type] || defaults.catalog;
const desc = params.get("desc") || config.desc;

document.getElementById("kicker").textContent = config.kicker;
document.getElementById("title").textContent = title;
document.getElementById("desc").textContent = desc;
document.getElementById("img").src = img;
document.getElementById("img").alt = title;
document.getElementById("btn").href = url;

setTimeout(() => {
  window.location.href = url;
}, 1800);
</script>
</body>
</html>
